# Watchlist REST 시세 폴링 주기(초)
# - WatchlistQuoteHub 에서 사용
# - 0 이하 값은 기본값(5초) 적용
# - 해외/관심종목이 많다면 2~5초 권장
kis.watchlist.quote.period.sec=2
kis.watchlist.quote.period.ms=1000
kis.watchlist.quote.fetch.pool.size=4
kis.watchlist.quote.max.tokens.per.cycle=4
kis.ws.max.subscriptions=40
kis.ws.subscribe.min.interval.ms=100
kis.ws.unsubscribe.min.interval.ms=100

# 국내 관심종목 실시간(KIS websocket) 사용 여부
# - true: 국내는 WS 스트리밍, 해외만 REST 폴링
# - false: 국내/해외 모두 REST 폴링
kis.watchlist.domestic.realtime.enabled=true
